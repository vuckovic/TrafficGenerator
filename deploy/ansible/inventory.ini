# Edit ansible_host to the CURRENT address of each node (e.g. DHCP lease)
# before the first run. After install + reboot, nodes use the static
# management IPs from cluster.env (tgen1..tgen6 in /etc/hosts).
[tgen]
tgen1 ansible_host=192.168.50.11 node_id=1
tgen2 ansible_host=192.168.50.12 node_id=2
tgen3 ansible_host=192.168.50.13 node_id=3
tgen4 ansible_host=192.168.50.14 node_id=4
tgen5 ansible_host=192.168.50.15 node_id=5
tgen6 ansible_host=192.168.50.16 node_id=6

[controller]
tgen1

[tgen:vars]
ansible_user=pi
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
